<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TicTacToe</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>Tic Tac Toe</h1>

    <div class="container">

        <div class="game">
            <div class="box"></div>
            <div class="box"></div>
            <div class="box"></div>

            <div class="box"></div>
            <div class="box"></div>
            <div class="box"></div>

            <div class="box"></div>
            <div class="box"></div>
            <div class="box"></div>
        </div>

        <div class="lobby">

            <h2>🎮 Game Lobby</h2>
            <!-- Name Input -->
            <div class="section">
                <p><label>Enter Your Name</label></p>
                <div class="input-row">
                    <input type="text" placeholder="Player Name" id="playerName">
                    <button id="goBtn">Go</button>
                </div>
            </div>

            <!-- Choose Symbol -->
            <div class="section">
                <p>Choose Your Symbol: </p>
                <div class="choices">
                    <button class="choice" data-symbol="O">⭕</button>
                    <button class="choice" data-symbol="X">❌</button>
                </div>
            </div>

            <!-- Result -->
            <div class="win-lose" id="result">
                🏁 Result will appear here
            </div>

            <!-- Score -->
            <div class="score" id="scoreBoard">
                <p>📊 Score</p>
                <div id="p1">⭕ Player O : 0</div>
                <div id="p2">❌ Player X : 0</div>
            </div>

            <!-- Controls -->
            <div class="controls">
                <button id="startBtn">▶️ Start Game</button>
                <button id="resetBtn">🔄 Reset</button>
            </div>

        </div>

    </div>

    <script src="script.js"></script>
</body>

</html>
